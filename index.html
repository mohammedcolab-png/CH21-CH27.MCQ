let current=0, answers={}, active=[], activeChapter=21;
function startChapter(n){
 activeChapter=n; active=chapterData[n]||[]; current=0; answers={};
 document.getElementById('home').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 const titles={21:'Chapter 21 – Mycobacteria',22:'Chapter 22 – Actinomyces & Nocardia',23:'Chapter 23 – Mycoplasma',24:'Chapter 24 – Spirochetes',25:'Chapter 25 – Chlamydia',26:'Chapter 26 – Rickettsia',27:'Chapter 27 – Minor bacterial pathogens'};
 document.getElementById('chapterTitle').textContent=titles[n]||('Chapter '+n);
 render();
}
function goHome(){document.getElementById('quiz').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function render(){
 const x=active[current], done=Object.keys(answers).length, score=active.reduce((s,q,i)=>s+(answers[i]===q.correct?1:0),0);
 document.getElementById('topic').textContent=x.section;
 document.getElementById('counter').textContent=`Question ${current+1} of ${active.length}`;
 document.getElementById('score').textContent=`Answered: ${done} · Correct: ${score}`;
 document.getElementById('bar').style.width=`${(current+1)/active.length*100}%`;
 document.getElementById('question').textContent=x.q;
 const box=document.getElementById('options');box.innerHTML='';
 x.opts.forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+v;
 if(answers[current]!==undefined){b.disabled=true;if(i===x.correct)b.classList.add('correct');else if(i===answers[current])b.classList.add('wrong')}
 else b.onclick=()=>{answers[current]=i;render()};
 box.appendChild(b)});
 const f=document.getElementById('feedback');
 if(answers[current]!==undefined){f.className='feedback '+(answers[current]===x.correct?'good':'bad');f.textContent=answers[current]===x.correct?'Correct!':'Incorrect. Correct answer: '+String.fromCharCode(65+x.correct)+'. '+x.opts[x.correct];}
 else {f.className='hidden';f.textContent=''}
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').textContent=current===active.length-1?'Finish':'Next';
}
function move(d){
 if(d===1&&current===active.length-1){
 const score=active.reduce((s,q,i)=>s+(answers[i]===q.correct?1:0),0);
 alert(`Chapter ${activeChapter} complete!\nScore: ${score}/${active.length}\nAnswered: ${Object.keys(answers).length}/${active.length}`);
 goHome();return;
 }
 current=Math.max(0,Math.min(active.length-1,current+d));render();
}
